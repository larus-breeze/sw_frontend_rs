[package]
name = "tools"
version = "0.1.0"
edition = "2024"
default-run = "extract_menus"

[[bin]]
name = "extract_polar_store"
path = "src/extract_polar_store.rs"

[[bin]]
name = "extract_menus"
path = "src/extract_menus.rs"

[dependencies.corelib]
path = ".."
default-features = false 
features = ["colors_8_indexed", "eeprom_size_8192"]

[dependencies]
serde = { version="1.0.228", features=["derive"] }
serde_json = "1.0.145"
rust_xlsxwriter = "0.92.0"
